[build-system]
requires = ["setuptools>=72.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pnnl-imputation-ffnn"
version = "0.1.0"
description = "OEDISI Feed-Forward Neural Network Imputation Federate"
authors = [
    {name = "Tylor Slay", email = "tylor.slay@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "setuptools>=72.1.0",
    "helics>=3.4.0",
    "helics-apps>=3.4.0",
    "pydantic>=2.0.0",
    "python-multipart",
    "uvicorn",
    "fastapi",
    "pyarrow",
    "scipy",
    "matplotlib",
    "plotly",
    "numpy>=1.24.0,<2.0.0",
    "pandas",
    "scikit-learn",
    "tensorflow>=2.15.0",
    "keras",
    "requests",
    "oedisi~=3.0",
    "opendssdirect-py>=0.7.0",
]

[project.scripts]
imputation-server = "imputation_federate.server:main"
imputation-sim = "imputation_federate.federate:main"

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.6.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E402"]
